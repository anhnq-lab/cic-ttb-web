<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#004488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a192f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#ff9900" stroke-width="2"/>
  
  <!-- Building icon -->
  <path d="M20 50V22L32 14L44 22V50" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Building windows -->
  <rect x="26" y="26" width="5" height="5" fill="#ff9900" rx="0.5"/>
  <rect x="33" y="26" width="5" height="5" fill="#ff9900" rx="0.5"/>
  <rect x="26" y="34" width="5" height="5" fill="#ff9900" rx="0.5"/>
  <rect x="33" y="34" width="5" height="5" fill="#ff9900" rx="0.5"/>
  
  <!-- Door -->
  <rect x="28" y="42" width="8" height="8" fill="white" rx="0.5"/>
  
  <!-- Digital connection dots -->
  <circle cx="16" cy="32" r="2" fill="#ff9900"/>
  <circle cx="48" cy="32" r="2" fill="#ff9900"/>
  <circle cx="32" cy="10" r="2" fill="#ff9900"/>
  
  <!-- Connection lines -->
  <line x1="18" y1="32" x2="20" y2="32" stroke="#ff9900" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="44" y1="32" x2="46" y2="32" stroke="#ff9900" stroke-width="1" stroke-dasharray="2,1"/>
  <line x1="32" y1="12" x2="32" y2="14" stroke="#ff9900" stroke-width="1" stroke-dasharray="2,1"/>
</svg>
